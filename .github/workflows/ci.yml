name: CI — Escapes Backend

# Bloquea el merge si falla cualquiera de estos pasos. El despliegue a Coolify
# se dispara con el push a main, así que esto es lo último antes de producción.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Tipos, tests e integración
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: escapes_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']

    env:
      NODE_ENV: test
      PORT: 3901
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/escapes_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-jwt-secret-0123456789abcdef0123456789
      STRIPE_SECRET_KEY: sk_test_ci_dummy
      STRIPE_WEBHOOK_SECRET: whsec_ci_dummy
      SMTP_HOST: 127.0.0.1
      SMTP_ALLOW_UNSECURE: 'true'
      SMTP_USER: ci@example.com
      SMTP_PASSWORD: ci

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Esquema base + datos de prueba
        run: |
          sudo apt-get install -y --no-install-recommends postgresql-client >/dev/null
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f migrations/000_baseline_schema.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f scripts/smoke-seed.sql

      - name: Tests unitarios
        run: npx vitest run

      - name: Smoke Stripe webhook
        run: npx tsx scripts/smoke-stripe-webhook.ts

      - name: Smoke email
        run: npx tsx scripts/smoke-email.ts

      - name: Smoke de seguridad (backend real)
        run: |
          node --import tsx index.ts > backend.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:3901/api/health >/dev/null && break; sleep 2; done
          API_BASE=http://localhost:3901 npx tsx scripts/smoke-security.ts || (tail -50 backend.log; exit 1)
